<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/records.css" rel="stylesheet">
    <title>Records</title>
</head>

<body>
    <div class = "body">
        <h1 id = "main-h1">All Records</h1>
        <div class = "date-input">
            <input type = "datetime-local" id = "from">
            <input type = "datetime-local" id = "to">
        </div>
    <div class="header">
        <div class="one">
            <h2>Suppliers</h2>
        </div>
        <div class="two">
            <h2>Products</h2>
        </div>
        <div class="three">
            <h2>Customers</h2>
        </div>

    </div>

    <div class="body">
        <div class="suppliers">
            <table>
                <thead>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Items</th>
                </thead>
                                <tbody></tbody>

            </table>
        </div>


        <div class="products">
            <table>
                <thead>
                    <th>Name</th>
                    <th>Qty</th>
                    <th>Category</th>

                    <th>Sale Price</th>

                    <th>Supplier</th>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class = "customers">
            <table>
                <thead>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>E mail</th>
                    <th>Address</th>
                    <th>Gender</th>
                    <th>Discount</th>
                    <th>Account</th>
                </thead>
                <tbody></tbody>

    </div>
    </div>
