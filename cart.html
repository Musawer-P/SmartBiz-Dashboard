<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart</title>
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>

  <div class="cart-page">

    <h2>Shopping Cart</h2>

    <table class="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Total</th>
          <th>Remove</th>
        </tr>
      </thead>

      <tbody id="cartTableBody">
      </tbody>
    </table>

    <div class="cart-summary">
      <div class="summary-row">
        <span>Total Amount:</span>
        <strong>$<span id="cartTotal">0</span></strong>
      </div>

      <button id="checkoutBtn" class="checkout-btn">
        Checkout
      </button>
    </div>

  </div>

  <script src="js/cart.js"></script>
</body>
</html>
