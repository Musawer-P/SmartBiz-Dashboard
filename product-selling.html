<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Selling</title>
  <link rel="stylesheet" href="css/product-selling.css">
</head>
<body>

  <div class="pos-container">

    <!-- PRODUCTS SECTION -->
    <div class="products-section">
      <h2>Products</h2>

      <div id="productsContainer" class="products-grid">

    </div>
    </div>

    <div class="cart-section">
      <h2>Cart</h2>

      <ul id="cartItems" class="cart-items">
      </ul>

      <div class="cart-total">
        Total: $<span id="totalPrice">0</span>
      </div>

      <button id="checkoutBtn" class="checkout-btn">
        Proceed to Checkout
      </button>
    </div>

  </div>

  <!-- JS -->
  <script src="js/products-selling.js"></script>
</body>
</html>
