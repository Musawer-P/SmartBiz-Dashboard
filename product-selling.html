<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Selling</title>
  <link rel="stylesheet" href="css/product-selling.css">
</head>
<body>


  <div class = "main-row">
<div class="products-container">
   <div class="product-cart" 
     data-name="Chocolate" 
     data-price="20">
  
  <div class="p-price">
    <p id = "p-price">20$</p>
  </div>

  <div class="img">
    <img src="images/chocolate.png" id = "p-img">
  </div>

  <div class="product-desc">
    <p>Chocolate</p>
    <p>20 PCS</p>
  </div>

</div>
    </div>

       <div class = "cc-row">
  <div class = "cart">
    <h1 id = "h1-cart">Cart</h1>
    <select id="customer-select">
  <option value="">Select Customer</option>
</select>

<!-- Loyalty Panel: Place this inside your Checkout Page -->
<div id="loyalty-panel" class="loyalty-card" style="display: none;">
    <h4><span id="selected-customer-name">Customer</span>'s Rewards</h4>
    <div id="tier-badge" class="badge">BRONZE</div>
    
    <div class="loyalty-stats">
        <p>Lifetime Spend: <strong id="lifetime-spend">$0</strong></p>
        <!-- The Progress Bar for Portfolio impact -->
        <div class="progress-container">
            <div id="loyalty-progress" class="progress-bar"></div>
        </div>
        <small id="loyalty-msg">Spend $XX more for Silver!</small>
    </div>
    
    <div class="discount-alert" id="discount-banner">
         <span id="discount-pct">0</span>% Loyalty Discount Applied!
    </div>
</div>

    <div class = "cart-table">
      <table id = "cart-table">
        <thead>
          <th>Name</th>
          <th>Qty</th>
          <th>Price</th>
        </thead>
        <tbody>
        
        </tbody>
      </table>
    </div>
    <div class = "checkout-btn">

    
    </div>
  </div>

<div class = "checkout">
      <h1 id = "h1-checkout">Payment</h1>

      <div class = "payment-btn">
        <button type = "submit" id = "cash">Cash</button>
        <button type = "submit" id = "loan">Loan</button>
      </div>
      <div class = "payment-footer">
<div class="cart-total">
  <h3>Total: <span id="cart-total">0</span> $</h3>
</div>        <button type = "submit" id = "payment-submit">Submit</button>
      </div>
    </div>
</div>


</div>




<script src="js/products-selling.js"></script>
<script src="js/customer-select.js"></script>
<script src="js/customer-discount.js"></script>   <!-- Today Sales -->

<script src="js/dashboard.js"></script>   <!-- Today Sales -->
<script src="js/sales.js"></script>       <!-- Sales Reports -->
<script src="js/bills.js"></script>       <!-- Bills -->
<script src="js/customer-loan.js"></script>
</body>
</html>
