<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Selling</title>
  <link rel="stylesheet" href="css/product-selling.css">
</head>
<body>


<div class = "body">
  <div class = "row">
  <div class = "main">
    <div class="products-container">
   <div class="product-cart" 
     data-name="Chocolate" 
     data-price="20">
  
  <div class="p-price">
    <p id = "p-price">20$</p>
  </div>

  <div class="img">
    <img src="images/chocolate.png" id = "p-img">
  </div>

  <div class="product-desc">
    <p>Chocolate</p>
    <p>20 PCS</p>
  </div>

</div>
</div>
  </div>

  <div class = "cc-row">
  <div class = "cart">
    <h1 id = "h1-cart">Cart</h1>
    <select id="customer-select">
  <option value="">Select Customer</option>
</select>
    <div class = "cart-table">
      <table id = "cart-table">
        <thead>
          <th>Name</th>
          <th>Qty</th>
          <th>Price</th>
        </thead>
        <tbody>
        
        </tbody>
      </table>
    </div>
    <div class = "checkout-btn">

    
    </div>
  </div>

<div class = "checkout">
      <h1 id = "h1-checkout">Payment</h1>

      <div class = "payment-btn">
        <button type = "submit" id = "cash">Cash</button>
        <button type = "submit" id = "credit">Credit</button>
      </div>
      <div class = "payment-footer">
<div class="cart-total">
  <h3>Total: <span id="cart-total">0</span> $</h3>
</div>        <button type = "submit" id = "payment-submit">Submit</button>
      </div>
    </div>
</div>
</div>
</div>




  <!-- JS -->  <script src="js/customer-select.js"></script>
  <script src="js/products-selling.js"></script>
<script src="js/dashboard.js"></script>   <!-- Today Sales -->
<script src="js/sales.js"></script>       <!-- Sales Reports -->
<script src="js/bills.js"></script>       <!-- Bills -->
</body>
</html>
