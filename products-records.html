<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href = "css/products.css" rel = "stylesheet">
    <title>Products</title>
</head>
<body>
     <div class = "body">
    <h1>Products</h1>
    <div class = "date">
        <input type = "datetime-local" id = "from">
        <input type = "datetime-local" id = "to">
    </div>
    <div class = "table">
        <table id = "table">
            <thead>
                              <th>#</th>

                <th>Name</th>
                <th>Qty</th>
                <th>Category</th>
                <th>Barcode</th>
                <th>Real Price</th>
                <th>Sale Price</th>
                <th>Payment</th>
                <th>Supplier</th>
                                <th>Date</th>

               <th>Edit</th>

            </thead>
            <tbody id = "productsTable">
            </tbody>    
    
        </table>
    </div>
    </div>

<!-- Edit Product Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Edit Product</h2>
      <span class="close-btn" onclick="closeModal()">&times;</span>
    </div>
    <form id="editForm">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Qty</label>
        <input type="number" id="qty" required>
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" id="category">
      </div>
      <div class="form-group">
        <label>Barcode</label>
        <input type="text" id="barcode">
      </div>
      <div class="form-group">
        <label>Real Price</label>
        <input type="number" id="realPrice">
      </div>
      <div class="form-group">
        <label>Sale Price</label>
        <input type="number" id="salePrice">
      </div>
      <div class="form-group">
        <label>Payment</label>
        <input type="text" id="payment">
      </div>
      <div class="form-group">
        <label>Supplier</label>
        <input type="text" id="supplier">
      </div>
      <button type="button" class="save-btn" onclick="saveProduct()">Save</button>
    </form>
  </div>
</div>

    <script src = "js/products-records.js">
    </script>
</body>
</html>
